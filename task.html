<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание семинара</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #f0f7ff 0%, #fff0f8 100%);
            color: #4a4a6a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .cloud-top-left {
            position: absolute;
            top: 50px;
            left: 50px;
            font-size: 50px;
            color: #b0e0e6;
            opacity: 0.7;
        }

        .container {
            max-width: 800px;
            width: 90%;
            text-align: center;
            padding: 60px 20px;
            z-index: 1;
        }

        .logo {
            font-size: 34px;
            font-weight: 700;
            color: #6a5acd;
            margin-bottom: 50px;
            letter-spacing: 2px;
        }

        .task-content {
            background: white;
            padding: 70px 50px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(106, 90, 205, 0.15);
            max-width: 650px;
            margin: 0 auto;
            position: relative;
            border: 3px solid #f0f7ff;
        }

        .task-title {
            font-size: 32px;
            font-weight: 700;
            color: #8a2be2;
            margin-bottom: 35px;
            line-height: 1.3;
        }

        .task-text {
            font-size: 24px;
            font-weight: 500;
            color: #4682b4;
            line-height: 1.6;
            margin-bottom: 45px;
        }

                .back-link {
            display: inline-block;
            padding: 16px 40px;
            background-color: #f0f7ff;
            color: #6a5acd;
            text-decoration: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 2px solid #87ceeb;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .back-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.4),
                transparent
            );
            transition: left 0.6s;
            z-index: -1;
        }

        .back-link:hover {
            background-color: #87ceeb;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(135, 206, 235, 0.3);
        }

        .back-link:hover::before {
            left: 100%;
        }

        footer {
            text-align: center;
            padding: 25px 20px;
            color: #9370db;
            font-size: 14px;
            border-top: 1px solid #e6e6fa;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(5px);
            width: 100%;
            position: fixed;
            bottom: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <!-- Декоративное облачко в левом верхнем углу -->
    <div class="cloud-top-left">☁️</div>

    <div class="container">
        <div class="logo"></div>
        <div class="task-content">
            <h2 class="task-title">задание</h2>
            <p class="task-text">Пожми руку 5 людям и скажи каждому комплимент</p>
            <a href="index.html" class="back-link">Вернуться на главную</a>
        </div>
    </div>

    <footer></footer>
</body>
</html>
